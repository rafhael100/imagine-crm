# CI-only HTTP lab on a disposable GitHub runner; NEVER publish on the VPS.
# Real staging requires separate externally validated HTTPS/auth and network review.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Only the synthetic OTP preview from F3-240 uses inline styles/scripts.
    # Main page does not allow inline code. Both prohibit external connections.
    map $uri $crm_preview_csp {
        default "default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
        /fluxo-demo/index.html "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        autoindex off;
        client_max_body_size 8k;

        auth_basic "Imagine CRM - CI private preview";
        auth_basic_user_file /etc/nginx/crm-preview.htpasswd;

        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "$crm_preview_csp" always;

        location = / {
            limit_except GET HEAD { deny all; }
            try_files /index.html =404;
        }
        location = /index.html {
            limit_except GET HEAD { deny all; }
            try_files /index.html =404;
        }
        location = /assets/logo-imagine.png {
            limit_except GET HEAD { deny all; }
            try_files /assets/logo-imagine.png =404;
        }
        location = /assets/site.css {
            limit_except GET HEAD { deny all; }
            try_files /assets/site.css =404;
        }
        location = /assets/site.js {
            limit_except GET HEAD { deny all; }
            try_files /assets/site.js =404;
        }
        location = /fluxo-demo/index.html {
            limit_except GET HEAD { deny all; }
            try_files /fluxo-demo/index.html =404;
        }
        location / { return 404; }
    }
}
