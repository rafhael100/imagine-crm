# Development-only private staging, no business routes or real credentials.
# Never run docker compose against production customer data.
name: imagine-crm-private-staging
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: imagine_crm_staging
      POSTGRES_USER: crm_staging
      POSTGRES_PASSWORD: ${CRM_STAGING_DB_PASSWORD:?Provide a non-production staging password}
    volumes:
      - crm_staging_pg_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_staging -d imagine_crm_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ../..
      dockerfile: infra/staging/Dockerfile
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:18080
      APP_KEY: ${CRM_STAGING_APP_KEY:?Provide a non-production staging application key}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: imagine_crm_staging
      DB_USERNAME: crm_staging
      DB_PASSWORD: ${CRM_STAGING_DB_PASSWORD:?Provide a non-production staging password}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      CRM_AUTH_EXPERIMENTAL: "false"
      CRM_ASAAS_SANDBOX_ENABLED: "false"
      CRM_ASAAS_SANDBOX_PAYMENTS_ENABLED: "false"
      CRM_ASAAS_SANDBOX_RECONCILIATION_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - crm_staging_app_storage:/var/www/html/storage
      - crm_staging_app_cache:/var/www/html/bootstrap/cache
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ../../public:/srv/crm/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [internal]
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    internal: true

volumes:
  crm_staging_pg_data:
  crm_staging_app_storage:
  crm_staging_app_cache:
