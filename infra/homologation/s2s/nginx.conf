limit_req_zone $binary_remote_addr zone=automation:1m rate=10r/s;
server {
 listen 8443 ssl;
 server_name crm-s2s;
 ssl_certificate /certs/server.crt;
 ssl_certificate_key /certs/server.key;
 ssl_client_certificate /certs/ca.crt;
 ssl_verify_client on;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 access_log off;
 client_max_body_size 4k;
 client_body_timeout 3s;
 location = /private/automations/state {
  limit_req zone=automation burst=20 nodelay;
  include fastcgi_params;
  fastcgi_pass crm-app:9000;
  fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
  fastcgi_param SCRIPT_NAME /index.php;
  fastcgi_param HTTPS on;
  fastcgi_param IMAGINE_MTLS_VERIFY $ssl_client_verify;
  fastcgi_param IMAGINE_MTLS_CERT $ssl_client_escaped_cert;
 }
 location / { return 404; }
}
