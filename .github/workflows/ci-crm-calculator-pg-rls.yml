name: CRM calculator PG idempotency and RLS (disposable)

on:
  pull_request:
    paths:
      - 'tests/Labs/calculator/**'
      - 'scripts/ci/run-calculator-interest-pg-roundtrip.php'
      - 'app/Core/Leads/SyntheticCalculatorPgDelivery.php'
      - 'scripts/ci/calculator-private-http-router.php'
      - 'scripts/ci/test-calculator-private-http.mjs'
      - '.github/workflows/ci-crm-calculator-pg-rls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ephemeral-calculator-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: imagine_calc_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-not-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imagine_calc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: imagine_calc_ci
      PGPASSWORD: ci-disposable-not-secret
      CRM_CALCULATOR_LAB: synthetic-only
    steps:
      - name: Checkout isolated review code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable Commercial Node producer
        uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-comercial
          ref: f2454eb58b77702f2df69be658c43ecd49f3beb3
          path: _commercial_calculator_ci
          persist-credentials: false
      - name: Install Node22 for synthetic producer
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup isolated PHP with PDO PostgreSQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql
          tools: none
          coverage: none
      - name: Verify disposable database and create limited role
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = "true"
          test "$PGDATABASE" = "imagine_calc_ci"
          test "$(psql -X -qAt -c 'SELECT current_database()')" = "imagine_calc_ci"
          psql -X -v ON_ERROR_STOP=1 -1 <<'SQL'
          CREATE ROLE crm_calc_ci LOGIN PASSWORD 'ci-only-role'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE imagine_calc_ci TO crm_calc_ci;
          GRANT USAGE ON SCHEMA public TO crm_calc_ci;
          SQL
      - name: Create CI-only calculator tables with FORCE RLS
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -1 -f tests/Labs/calculator/calculator-interest-rls-ci.sql
      - name: Test idempotency nonce and tenant isolation under restricted role
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/Labs/calculator/calculator-interest-rls-assertions-ci.sql
      - name: Real disposable PostgreSQL roundtrip from pinned Node producer
        run: |
          set -euo pipefail
          test "$(git -C _commercial_calculator_ci rev-parse HEAD)" = "f2454eb58b77702f2df69be658c43ecd49f3beb3"
          php -l scripts/ci/run-calculator-interest-pg-roundtrip.php
          node _commercial_calculator_ci/scripts/emit-calculator-interest-fixture-ci.mjs | php scripts/ci/run-calculator-interest-pg-roundtrip.php
      - name: Real loopback HTTP to temporary PostgreSQL metadata (NO PII)
        env:
          CRM_CALCULATOR_HTTP_CI: synthetic-loopback
          CRM_CALCULATOR_HTTP_PG_CI: synthetic-pg
        run: |
          set -euo pipefail
          php -l scripts/ci/calculator-private-http-router.php
          php -l app/Core/Leads/SyntheticCalculatorPgDelivery.php
          node scripts/ci/test-calculator-private-http.mjs
          test "$(psql -X -qAt -c "SELECT count(*) FROM public.crm_calc_lab_intents")" = '2'
          test "$(psql -X -qAt -c "SELECT count(*) FROM public.crm_calc_lab_consent_events WHERE intent_kind='marketing_requested'")" = '0'
      - name: Read-only report of disabled business effects
        if: always()
        run: |
          echo '### Calculator PG16 laboratory (NO-GO)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Metadata only; ephemeral private HTTP route, NO public endpoint, PII, production migration or email' >> "$GITHUB_STEP_SUMMARY"
          echo 'A synthetic RLS policy alone does not prove business authorization' >> "$GITHUB_STEP_SUMMARY"
