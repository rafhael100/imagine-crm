name: CRM F3-59 - Strict metadata JSON wire format
on:
  pull_request:
    paths:
      - 'app/Core/Leads/SignedServiceHandoffBoundary.php'
      - 'tests/Labs/F3_59/**'
      - '.github/workflows/crm-f359-canonical-json-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refuse-ambiguous-json:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Verify fail-closed byte-canonical wire contract
        run: |
          php -l app/Core/Leads/SignedServiceHandoffBoundary.php
          php -l tests/Labs/F3_59/test_canonical_json.php
          php tests/Labs/F3_59/test_canonical_json.php
