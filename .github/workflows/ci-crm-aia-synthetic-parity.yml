name: CRM Imagine - AIA Synthetic Contract Parity

on:
  push:
    branches:
      - dev/fast-track-crm-2026-11-04
  pull_request:
    branches:
      - dev/fast-track-crm-2026-11-04

permissions:
  contents: read

concurrency:
  group: crm-aia-f3-45-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contract:
    name: PHP ${{ matrix.php }} / pinned CRM-Agents compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Checkout CRM (source under test)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned Agents synthetic fixture (not a deploy)
        uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-ai-agents
          ref: 4a03adf5f91e760950adaa3239fb2c8dba05da6d
          path: _synthetic_agents_fixture
          persist-credentials: false

      - name: Verify immutable Agents revision
        run: |
          test "$(git -C _synthetic_agents_fixture rev-parse HEAD)" = "4a03adf5f91e760950adaa3239fb2c8dba05da6d"

      - name: PHP without Composer, services or credentials
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: PHP syntax check
        run: |
          php -l app/Support/Synthetic/AiaReadOnlyMockBoundary.php
          php -l scripts/ci/check-aia-crm-contract-parity.php
          php -l scripts/ci/check-aia-php-public-facade-witness.php
          php -l _synthetic_agents_fixture/tools/op01_php_public_response_probe.php
          php -l _synthetic_agents_fixture/src/Domain/MockError.php
          php -l _synthetic_agents_fixture/src/Domain/TenantContext.php
          php -l _synthetic_agents_fixture/src/MockBridge/MockCrmReadRequest.php

      - name: Cross-repository syntactic parity; uniform deny
        run: php scripts/ci/check-aia-crm-contract-parity.php

      - name: Execute pinned Agents public facade, quarantine synthetic success
        run: php scripts/ci/check-aia-php-public-facade-witness.php
