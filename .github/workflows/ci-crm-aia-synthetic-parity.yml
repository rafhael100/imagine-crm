name: CRM Imagine - AIA Synthetic Contract Parity

on:
  push:
    branches:
      - dev/fast-track-crm-2026-11-04
  pull_request:
    branches:
      - dev/fast-track-crm-2026-11-04

permissions:
  contents: read

concurrency:
  group: crm-aia-f3-45-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contract:
    name: PHP ${{ matrix.php }} / pinned CRM-Agents compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Checkout CRM (source under test)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned Agents synthetic fixture (not a deploy)
        uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-ai-agents
          ref: 5a2c8af18448aeebfe8eda0d7570f34ffbe24611
          path: _synthetic_agents_fixture
          persist-credentials: false

      - name: Verify immutable Agents revision
        run: |
          test "$(git -C _synthetic_agents_fixture rev-parse HEAD)" = "5a2c8af18448aeebfe8eda0d7570f34ffbe24611"

      - name: PHP without Composer, services or credentials
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: PHP syntax check
        run: |
          php -l app/Support/Synthetic/AiaReadOnlyMockBoundary.php
          php -l app/Support/Synthetic/AiaFixtureNonceLedger.php
          php -l app/Support/Synthetic/AiaHmacFixturePreflight.php
          php -l scripts/ci/check-aia-hmac-fixture.php
          php -l scripts/ci/check-aia-f227-signer-reciprocal.php
          php -l app/Core/Leads/AgentsReadResponseAssessment.php
          php -l app/Core/Leads/AgentsReadResponseInspector.php
          php -l tests/Unit/AgentsReadResponseInspectorTest.php
          php -l scripts/ci/check-aia-crm-contract-parity.php
          php -l scripts/ci/check-aia-php-public-facade-witness.php
          php -l _synthetic_agents_fixture/tools/op01_php_public_response_probe.php
          php -l _synthetic_agents_fixture/src/Domain/MockError.php
          php -l _synthetic_agents_fixture/src/Domain/TenantContext.php
          php -l _synthetic_agents_fixture/src/MockBridge/MockCrmReadRequest.php

      - name: Verify signed and replay-protected synthetic bytes without any authority
        run: php scripts/ci/check-aia-hmac-fixture.php

      - name: Original Agents signed body/proof issuer checked by original CRM HMAC verifier
        run: php scripts/ci/check-aia-f227-signer-reciprocal.php

      - name: Cross-repository syntactic parity; uniform deny
        run: php scripts/ci/check-aia-crm-contract-parity.php

      - name: Execute pinned Agents public facade, quarantine synthetic success
        run: php scripts/ci/check-aia-php-public-facade-witness.php

      - name: Cross-repository canonical OP-01 exchange remains synthetic and denied by CRM Core
        run: |
          php -l scripts/ci/check-aia-op01-json-exchange.php
          php scripts/ci/check-aia-op01-json-exchange.php
