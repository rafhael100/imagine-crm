name: CRM F3-56 - Signed HTTP handoff and PG16 readback CI
on:
  pull_request:
    paths:
      - 'app/Core/Leads/SignedServiceHandoffBoundary.php'
      - 'app/Core/Leads/TrustedServiceBindingCandidateResolver.php'
      - 'app/Core/Leads/SignedTechnicalReceiptCandidateVerifier.php'
      - 'tests/Labs/F3_52/**'
      - 'tests/Labs/F3_53/**'
      - 'tests/Labs/F3_54/**'
      - 'tests/Labs/F3_55/**'
      - 'tests/Labs/F3_56/**'
      - 'tests/Labs/F3_59/**'
      - 'tests/Labs/F3_60/**'
      - 'tests/Labs/F3_61/**'
      - 'tests/Labs/F3_62/**'
      - 'tests/Labs/F3_63/**'
      - '.github/workflows/crm-f356-http-signed-handoff-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http-transport-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f353-superuser-synthetic-only
          POSTGRES_DB: f353_nonce_ci
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d f353_nonce_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CRM_F356_HTTP_LAB: '1'
      CRM_F361_SERVER_PRINCIPAL_ID: 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
      DB_HOST: 127.0.0.1
      DB_DATABASE: f353_nonce_ci
      PGPASSWORD: f353-superuser-synthetic-only
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql,pgsql
          tools: none
          coverage: none
      - name: Provision restricted disposable PostgreSQL schema
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d f353_nonce_ci -f tests/Labs/F3_53/nonce_pg16.sql
          psql -h 127.0.0.1 -U postgres -d f353_nonce_ci -f tests/Labs/F3_54/transaction_pg16.sql
          psql -h 127.0.0.1 -U postgres -d f353_nonce_ci -f tests/Labs/F3_60/service_bindings_pg16.sql
          psql -h 127.0.0.1 -U postgres -d f353_nonce_ci <<'SQL'
          GRANT SELECT ON public.crm_service_bindings TO f353_sender_a;
          CREATE POLICY f361_http_service_scope ON public.crm_service_bindings
            FOR SELECT TO f353_sender_a USING (
             organization_reference='11111111-1111-4111-8111-111111111111'::uuid
            );
          SQL
      - name: Start loopback HTTP router and test signed reconciliation
        run: |
          set -euo pipefail
          php -l app/Core/Leads/SignedServiceHandoffBoundary.php
          php -l app/Core/Leads/TrustedServiceBindingCandidateResolver.php
          php -l app/Core/Leads/SignedTechnicalReceiptCandidateVerifier.php
          php -l tests/Labs/F3_62/SyntheticTechnicalReceiptSigner.php
          php tests/Labs/F3_59/test_canonical_json.php
          php -l tests/Labs/F3_56/router_synthetic_handoff.php
          php -l tests/Labs/F3_56/test_http_lost_ack.php
          export CRM_F356_REQUEST_KEY_HEX="$(openssl rand -hex 48)"
          export CRM_F356_LOOKUP_KEY_HEX="$(openssl rand -hex 48)"
          export CRM_F362_RECEIPT_KEY_HEX="$(openssl rand -hex 48)"
          test "$CRM_F356_REQUEST_KEY_HEX" != "$CRM_F356_LOOKUP_KEY_HEX"
          test "$CRM_F356_REQUEST_KEY_HEX" != "$CRM_F362_RECEIPT_KEY_HEX"
          test "$CRM_F356_LOOKUP_KEY_HEX" != "$CRM_F362_RECEIPT_KEY_HEX"
          php -S 127.0.0.1:19156 tests/Labs/F3_56/router_synthetic_handoff.php >/dev/null 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if php -r '$s=@fsockopen("127.0.0.1",19156,$e,$m,0.2);if($s){fclose($s);exit(0);}exit(1);'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
          php tests/Labs/F3_56/test_http_lost_ack.php
          export CRM_F363_REVOCATION_LAB=1
          php -l tests/Labs/F3_63/test_hot_revocation_http.php
          # Same running server and signed keys; DBA-only synthetic change.
          psql -h 127.0.0.1 -U postgres -d f353_nonce_ci -v ON_ERROR_STOP=1 \\
            -c "UPDATE public.crm_service_bindings SET state='revoked' WHERE principal_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid"
          php tests/Labs/F3_63/test_hot_revocation_http.php
          # Expired but otherwise active binding remains fail-closed.
          psql -h 127.0.0.1 -U postgres -d f353_nonce_ci -v ON_ERROR_STOP=1 \\
            -c "UPDATE public.crm_service_bindings SET state='active', expires_at_epoch=1762000000 WHERE principal_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid"
          php tests/Labs/F3_63/test_hot_revocation_http.php
