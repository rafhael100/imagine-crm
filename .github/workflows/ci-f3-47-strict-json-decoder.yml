name: CRM F3-47 - Strict technical JSON wire decoder

on:
  push:
    branches:
      - dev/f3-47-strict-technical-json-decoder-2026-11-10
  pull_request:
    paths:
      - 'app/Core/Leads/PortalTechnicalEnvelopeDecoder.php'
      - 'tests/Unit/PortalTechnicalEnvelopeDecoderTest.php'
      - 'tests/Labs/F3_47/**'
      - '.github/workflows/ci-f3-47-strict-json-decoder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-envelope-domain:
    name: PHP ${{ matrix.php }} / strict JSON and public route gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml,pdo_sqlite,sqlite3,curl,zip
          tools: composer:v2
          coverage: none
      - name: Static PHP and pure Core compatibility
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Core/Leads/PortalTechnicalEnvelopeDecoder.php
          php -l tests/Unit/PortalTechnicalEnvelopeDecoderTest.php
          php -l tests/Labs/F3_47/php83_json_decoder_smoke.php
          php tests/Labs/F3_47/php83_json_decoder_smoke.php
      - name: Install locked Laravel dependencies (PHP 8.4 required by current Symfony lock)
        if: matrix.php == '8.4'
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
      - name: PHPUnit strict wire decoder, HMAC and route gate
        if: matrix.php == '8.4'
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate --force
          php artisan test --filter=PortalTechnicalEnvelopeDecoderTest --no-ansi
          php artisan test --filter=PortalServiceHandoffInspectorTest --no-ansi
          php artisan test --filter=PublicRouteSurfaceSealTest --no-ansi
          php artisan test --filter=LeadIntakeReleaseGateTest --no-ansi
