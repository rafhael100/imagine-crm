name: CRM CORE-INT-02 - PostgreSQL fault injection atomic rollback

on:
  push:
    branches:
      - review/crm-portal-cross-db-ci-isolated-2026-11-11
  pull_request:
    paths:
      - 'tests/Labs/F3_40/**'
      - 'tests/Labs/F3_44/**'
      - '.github/workflows/ci-crm-portal-fault-injection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failure-before-receipt:
    name: PHP ${{ matrix.php }} / PG16 atomic rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f344-fixture-only-not-a-real-secret
          POSTGRES_DB: imagine_crm_handoff_ci
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d imagine_crm_handoff_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CRM_F340_LAB: '1'
      CRM_F344_FAULT_LAB: '1'
      DB_HOST: '127.0.0.1'
      DB_DATABASE: imagine_crm_handoff_ci
      DB_PASSWORD: f344-fixture-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql,pgsql
          tools: none
          coverage: none
      - name: Ensure fault-injection code stays OUT of operational CRM
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'F3_44|f344_inject_failure|CRM_F344_FAULT_LAB' \
             app routes bootstrap database/migrations 2>/dev/null; then
            echo 'F3-44 fixture must not enter business runtime' >&2
            exit 1
          fi
      - name: Syntax check and real PostgreSQL exception/timeout atomicity
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/Labs/F3_40/SyntheticPortalHandoffReceiver.php
          php -l tests/Labs/F3_44/fault_injection_pg16.php
          php tests/Labs/F3_40/test_handoff_pg16.php
          php tests/Labs/F3_44/fault_injection_pg16.php
