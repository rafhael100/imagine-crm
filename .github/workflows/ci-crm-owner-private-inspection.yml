name: CRM owner target inspection - read-only metadata and isolated PG16

on:
  pull_request:
    branches: [docs/crm-owner-drafts-verified-status-2026-11-17]
    paths:
      - 'scripts/ops/inspect-private-crm-owner-drafts.py'
      - 'scripts/ci/test_private_crm_owner_inspection.py'
      - 'scripts/ci/rehearse_private_crm_owner_inspection.py'
      - 'docs/operations/CRM-OWNER-PRIVATE-INSPECTION.md'
      - '.github/workflows/ci-crm-owner-private-inspection.yml'

permissions:
  contents: read

concurrency:
  group: crm-owner-private-inspection-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata-inspection:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout the actual reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact event, source and additive scope
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 -B - <<'PY'
          import os, subprocess
          assert os.environ['GITHUB_EVENT_NAME'] == 'pull_request'
          assert os.environ['GITHUB_REPOSITORY'] == 'rafhael100/imagine-crm'
          assert os.environ['HEAD_REPOSITORY'] == 'rafhael100/imagine-crm'
          assert os.environ['HEAD_BRANCH'] == 'feat/crm-owner-private-inspection-2026-11-18'
          assert os.environ['BASE_SHA'] == 'dc601be113b213dfd35fae61d00ff710b4f286e1'
          def git(*a): return subprocess.check_output(['git', *a], text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['CANDIDATE_SHA']
          subprocess.run(['git', 'merge-base', '--is-ancestor', os.environ['BASE_SHA'], 'HEAD'], check=True)
          expected = {'scripts/ops/inspect-private-crm-owner-drafts.py', 'scripts/ci/test_private_crm_owner_inspection.py', 'scripts/ci/rehearse_private_crm_owner_inspection.py', 'docs/operations/CRM-OWNER-PRIVATE-INSPECTION.md', '.github/workflows/ci-crm-owner-private-inspection.yml'}
          records = git('diff', '--name-status', '--no-renames', os.environ['BASE_SHA'], 'HEAD').splitlines()
          assert len(records) == len(expected)
          assert {line.split('\t')[1] for line in records if line.startswith('A\t')} == expected
          subprocess.run(['git', 'diff', '--check', os.environ['BASE_SHA'], 'HEAD'], check=True)
          print('CRM_OWNER_INSPECTION_EXACT_SOURCE_VERIFIED')
          PY
      - name: Verify minimization, command boundaries and filesystem behavior
        run: python3 -B scripts/ci/test_private_crm_owner_inspection.py
      - name: Observe real disposable PostgreSQL metadata without changing application data
        run: python3 -B scripts/ci/rehearse_private_crm_owner_inspection.py
