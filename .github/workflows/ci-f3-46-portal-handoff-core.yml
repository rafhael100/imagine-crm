name: CRM F3-46 - Portal service handoff core contract and deny gate

on:
  push:
    branches:
      - dev/f3-46-portal-service-handoff-inspection-core-2026-11-10
  pull_request:
    paths:
      - 'app/Core/Leads/PortalServiceHandoff**'
      - 'tests/Unit/PortalServiceHandoffInspectorTest.php'
      - '.github/workflows/ci-f3-46-portal-handoff-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff-core-contract:
    name: PHP ${{ matrix.php }} / Laravel PHPUnit / no business routes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,dom,xml,pdo_sqlite,sqlite3,curl,zip
          tools: composer:v2
          coverage: none
      - name: Check PHP syntax and locked Composer graph
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Core/Leads/PortalServiceHandoffAssessment.php
          php -l app/Core/Leads/PortalServiceHandoffInspector.php
          php -l tests/Unit/PortalServiceHandoffInspectorTest.php
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
      - name: Test domain/tenant security boundary, plus public route seal
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate --force
          php artisan test --filter=PortalServiceHandoffInspectorTest --no-ansi
          php artisan test --filter=PublicRouteSurfaceSealTest --no-ansi
          php artisan test --filter=LeadIntakeReleaseGateTest --no-ansi
