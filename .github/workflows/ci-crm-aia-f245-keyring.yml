name: CRM F245 - server-owned Ed25519 key-to-tenant PostgreSQL laboratory

on:
  pull_request:
    branches:
      - dev/aia-f244-integrated-acceptance-lab-2026-11-15

permissions:
  contents: read

concurrency:
  group: crm-aia-f245-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: imagine_crm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imagine_crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1
      CRM_AIA_F248_PARITY_LAB: 'true'
      AIA_F243_PG_LAB: 'true'
      AIA_F245_KEYRING_LAB: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: imagine_crm_ci
      DB_USERNAME: postgres
      DB_PASSWORD: ci-only-password
      RLS_TEST_USERNAME: crm_app_ci
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout exact CRM review HEAD without write credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout immutable original Agents Ed25519 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-ai-agents
          ref: fbf50543e7c52e6c59c6ffec58b7f6a6d30564b5
          path: _aia_f245_fixture
          persist-credentials: false
      - name: Verify runner identity, HEAD and exact public-source pin
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rafhael100/imagine-crm"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C _aia_f245_fixture rev-parse HEAD)" = "fbf50543e7c52e6c59c6ffec58b7f6a6d30564b5"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_DATABASE" = "imagine_crm_ci"
      - name: Install PHP 8.4 + PG/Sodium without deployment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, ctype, openssl, sodium, pdo_pgsql, pgsql
          coverage: none
          tools: composer
      - name: Restore existing locked Laravel sources only
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Test-only class and route guards
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Support/Synthetic/AgentsPrivateOwnedKeyringLab.php
          php -l tests/Feature/AgentsPrivateOwnedKeyringTest.php
          php -l app/Support/Synthetic/AgentsPrivatePgDiagnostic.php
          php -l _aia_f245_fixture/src/MockBridge/MockServiceIdentityPreflight.php
          if grep -R -E 'AgentsPrivateOwnedKeyringLab|AgentsPrivatePgDiagnostic|__synthetic_f245' routes bootstrap; then
            echo 'F245_UNAUTHORIZED_APP_ROUTE'; exit 1
          fi
          test ! -e routes/api.php
      - name: Run server-owned key and tenant rotation/replay tests
        shell: bash
        run: |
          set -euo pipefail
          php artisan test --filter=AgentsPrivateOwnedKeyringTest --no-ansi
          echo 'F245_CRM_OWNED_LAB_KEYRING_ONLY operational_decision=NO_GO' >> "$GITHUB_STEP_SUMMARY"
