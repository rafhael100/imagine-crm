name: CRM LEADS-PG01 - isolated Kanban and tenant RLS

on:
  pull_request:
    branches:
      - dev/fast-track-crm-2026-11-04
    paths:
      - 'app/Core/Leads/LaboratoryTenantLeadLedger.php'
      - 'app/Core/Tasks/LaboratoryTenantTaskLedger.php'
      - 'tests/Labs/tasks/**'
      - 'app/Core/Leads/LaboratorySignedSiteCapture.php'
      - 'tests/Labs/leads/**'
      - 'tests/Feature/PostgresLabLeadsRlsTest.php'
      - '.github/workflows/ci-crm-leads-rls.yml'

permissions:
  contents: read

concurrency:
  group: crm-leads-pg01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leads-pg16:
    name: PG16 membership / FORCE RLS / Kanban CAS (CI only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: imagine_crm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imagine_crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: imagine_crm_ci
      DB_USERNAME: postgres
      DB_PASSWORD: ci-only-password
      PGPASSWORD: ci-only-password
      RLS_TEST_USERNAME: crm_app_ci
      RLS_TEST_PASSWORD: ephemeral-role-only
      CRM_LEADS_LAB: synthetic-only
      CRM_TASKS_LAB: synthetic-only
      # Publicly visible fake fixture; never a secret or usable signing key.
      CRM_LEADS_SIGNING_KEY_CI: CI-ONLY-FAKE-KEY-2026-11-14-SITES-LEADS-PG05-NOT-SECRET
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
    steps:
      - name: Checkout no persisted GitHub token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: PHP 8.4 and PostgreSQL PDO
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, curl, zip, pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none
      - name: Install dependencies from lock
        run: |
          test -f composer.lock
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
      - name: Ephemeral local app key
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Prove ephemeral PG identity before tenant schema
        run: |
          php scripts/ci/verify-ephemeral-postgres.php --verify
          php artisan migrate --force --no-interaction
      - name: Create restricted membership probe role
        run: |
          php scripts/ci/verify-ephemeral-postgres.php --verify
          psql -X -h 127.0.0.1 -U postgres -d imagine_crm_ci \
            -v ON_ERROR_STOP=1 -1 <<'SQL'
          CREATE ROLE crm_app_ci LOGIN PASSWORD 'ephemeral-role-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE imagine_crm_ci TO crm_app_ci;
          GRANT USAGE ON SCHEMA public TO crm_app_ci;
          GRANT SELECT, INSERT, UPDATE, DELETE ON public.crm_memberships TO crm_app_ci;
          SQL
      - name: Create only synthetic lead RLS fixture
        run: |
          php scripts/ci/verify-ephemeral-postgres.php --verify
          psql -X -h 127.0.0.1 -U postgres -d imagine_crm_ci \
            -v ON_ERROR_STOP=1 -1 -f tests/Labs/leads/lead-kanban-rls-ci.sql
      - name: Create synthetic follow-up task ledger and event tables
        run: |
          php scripts/ci/verify-ephemeral-postgres.php --verify
          psql -X -h 127.0.0.1 -U postgres -d imagine_crm_ci \
            -v ON_ERROR_STOP=1 -1 -f tests/Labs/tasks/followup-tasks-rls-ci.sql
      - name: Execute real two-tenant leads and Kanban tests
        run: |
          php -l app/Core/Leads/LaboratoryTenantLeadLedger.php
          php -l app/Core/Tasks/LaboratoryTenantTaskLedger.php
          php -l app/Core/Leads/LaboratorySignedSiteCapture.php
          php -l tests/Feature/PostgresLabLeadsRlsTest.php
          php artisan test --filter=PostgresLabLeadsRlsTest --no-ansi
      - name: No-Go CI boundaries
        if: always()
        run: |
          {
            echo '### CRM LEADS-PG01 — CI-only'
            echo '- PostgreSQL16 disposal verified before all schema changes'
            echo '- Membership active checked and scoped with FORCE RLS'
            echo '- Same HEAD tests Sites intake, guarded revocation, task CAS and audit rollback'
            echo '- Signed Sites envelope laboratory: fake HMAC, expiry and one nonce/tenant'
            echo '- No customer PII, no public endpoint, no operational policy grants'
            echo '- Original 3-migration RLS workflow unchanged'
            echo '- DRAFT / NO-MERGE / NO-DEPLOY'
          } >> "$GITHUB_STEP_SUMMARY"
