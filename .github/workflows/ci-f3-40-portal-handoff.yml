name: CRM F3-40 - Portal handoff interoperability (synthetic PG16)

on:
  push:
    branches:
      - dev/f3-40-portal-handoff-receiver-2026-11-10
  pull_request:
    paths:
      - 'tests/Labs/F3_40/**'
      - '.github/workflows/ci-f3-40-portal-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-receipts-disposable-pg16:
    name: PHP MATRIX_PHP / PG16 isolated mock receiver
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f340-fixture-only-not-a-real-secret
          POSTGRES_DB: imagine_crm_handoff_ci
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d imagine_crm_handoff_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CRM_F340_LAB: '1'
      DB_HOST: 127.0.0.1
      DB_DATABASE: imagine_crm_handoff_ci
      DB_PASSWORD: f340-fixture-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql,pgsql
          tools: none
          coverage: none
      - name: Ensure no HTTP routes, migrations or runtime import the F3-40 CI lab
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'F3_40|crm_portal_handoff_ci|SyntheticPortalHandoffReceiver' \
            routes bootstrap app database/migrations 2>/dev/null; then
            echo 'F3-40 test-only receiver imported into operational CRM code' >&2
            exit 1
          fi
      - name: Check syntax and run real disposable PG16 receiver
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/Labs/F3_40/SyntheticPortalHandoffReceiver.php
          php -l tests/Labs/F3_40/test_handoff_pg16.php
          php -r '$d=new PDO("pgsql:host=127.0.0.1;port=5432;dbname=imagine_crm_handoff_ci","postgres",getenv("DB_PASSWORD"));if($d->query("SELECT current_database()")->fetchColumn()!=="imagine_crm_handoff_ci")exit(1);'
          php tests/Labs/F3_40/test_handoff_pg16.php
