name: CRM Sites F401 original Portal to CRM and Sites PostgreSQL16 (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'tests/Feature/PostgresSitesProvisioningF399Test.php'
      - 'app/Core/Leads/LaboratorySiteBindingProvisioner.php'
      - 'tests/Labs/leads/site-provisioning-authority-ci.sql'
      - 'tests/Labs/leads/site-portal-s2s-inbox-ci.sql'
      - 'app/Core/Leads/LaboratoryPortalS2sBindingGateway.php'
      - '.github/workflows/ci-crm-sites-f401-pg16.yml'
      - 'docs/desenvolvimento/CRM-SITES-F401-original-portal-interop-ci.md'
permissions:
  contents: read
concurrency:
  group: crm-sites-f401-pg16-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-portal-to-crm-and-sites-pg16:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: imagine_crm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imagine_crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1
      CI: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: imagine_crm_ci
      DB_USERNAME: postgres
      DB_PASSWORD: ci-only-password
      PGPASSWORD: ci-only-password
      RLS_TEST_USERNAME: crm_app_ci
      RLS_TEST_PASSWORD: ephemeral-role-only
      CRM_LEADS_LAB: synthetic-only
      CRM_TASKS_LAB: synthetic-only
      CRM_SITES_F399_PROVISION_CI: '1'
      CRM_SITES_F400_S2S_CI: '1'
      CRM_SITES_F401_PORTAL_CI: '1'
      PORTAL_SITES_F401_CI: '1'
      F401_PORTAL_SOURCE: ./portal-f401/apps/portal
      CRM_SITES_F398_CI: '1'
      SITES_F398_CRM_CAPTURE_CI: '1'
      F398_SITES_SOURCE: ./sites-f398
      CRM_LEADS_SIGNING_KEY_CI: CI-ONLY-FAKE-KEY-2026-11-14-SITES-LEADS-PG05-NOT-SECRET
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
    steps:
      - name: Checkout exact CRM candidate HEAD without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout original Sites emitter at verified fixed SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-sites
          ref: 1e24f47f7dd96c0e5d4b68f5a71aed7c861179f4
          path: sites-f398
          persist-credentials: false
      - name: Checkout exact original Portal F401 emitter at fixed SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-portal
          ref: 7dd716fb645b4b133e4c83320fce1ec0a9eda27e
          path: portal-f401
          persist-credentials: false
      - name: PHP 8.4 with PostgreSQL PDO
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, curl, zip, pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none
      - name: Verify sources, install locked dependencies
        run: |
          set -euo pipefail
          test "$(git -C sites-f398 rev-parse HEAD)" = 1e24f47f7dd96c0e5d4b68f5a71aed7c861179f4
          test "$(git -C portal-f401 rev-parse HEAD)" = 7dd716fb645b4b133e4c83320fce1ec0a9eda27e
          php -l portal-f401/apps/portal/app/Labs/SitesF401/PortalSitesCrmSignedBindingCommandLab.php
          php -l portal-f401/apps/portal/tests/Contracts/f401-crm-binding-emitter-ci.php
          php portal-f401/apps/portal/tests/Contracts/f401-crm-binding-emitter-ci.php
          test "$GITHUB_REPOSITORY" = rafhael100/imagine-crm
          php -l sites-f398/src/Integration/SyntheticCrmCaptureEnvelope.php
          php -l app/Core/Leads/LaboratorySiteBindingProvisioner.php
          php -l app/Core/Leads/LaboratoryPortalS2sBindingGateway.php
          php -l tests/Feature/PostgresSitesProvisioningF399Test.php
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
      - name: Set disposable app key and verify ephemeral PostgreSQL16 before DDL
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate --force
          php scripts/ci/verify-ephemeral-postgres.php --verify
          php artisan migrate --force --no-interaction
      - name: Create CI-only restricted tenant role
        run: |
          set -euo pipefail
          php scripts/ci/verify-ephemeral-postgres.php --verify
          psql -X -h 127.0.0.1 -U postgres -d imagine_crm_ci -v ON_ERROR_STOP=1 -1 <<'SQL'
          CREATE ROLE crm_app_ci LOGIN PASSWORD 'ephemeral-role-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE imagine_crm_ci TO crm_app_ci;
          GRANT USAGE ON SCHEMA public TO crm_app_ci;
          GRANT SELECT, INSERT, UPDATE, DELETE ON public.crm_memberships TO crm_app_ci;
          SQL
      - name: Install ONLY disposable lead and task test fixtures
        run: |
          set -euo pipefail
          php scripts/ci/verify-ephemeral-postgres.php --verify
          psql -X -h 127.0.0.1 -U postgres -d imagine_crm_ci -v ON_ERROR_STOP=1 -1 \
            -f tests/Labs/leads/lead-kanban-rls-ci.sql
          psql -X -h 127.0.0.1 -U postgres -d imagine_crm_ci -v ON_ERROR_STOP=1 -1 \
            -f tests/Labs/tasks/followup-tasks-rls-ci.sql
          php scripts/ci/verify-ephemeral-postgres.php --verify
          psql -X -h 127.0.0.1 -U postgres -d imagine_crm_ci -v ON_ERROR_STOP=1 -1 \
            -f tests/Labs/leads/site-provisioning-authority-ci.sql
          php scripts/ci/verify-ephemeral-postgres.php --verify
          psql -X -h 127.0.0.1 -U postgres -d imagine_crm_ci -v ON_ERROR_STOP=1 -1 \
            -f tests/Labs/leads/site-portal-s2s-inbox-ci.sql
      - name: Consume commands signed by original Portal F401 with original CRM/Sites on PG16
        run: |
          set -euo pipefail
          php artisan test \
            --filter=test_portal_s2s_scoped_commands_replay_rotation_and_atomic_revoke \
            --no-ansi --fail-on-skipped
      - name: State negative production gate
        if: always()
        run: |
          {
            echo '### CRM Sites F401 — disposable PG16 only'
            echo '- Upstream original Sites F398 at fixed SHA, original CRM signed capture and RLS ledger'
            echo '- Original Portal F401 SHA fixed and verified, original Sites F398 SHA fixed and verified; PHP standalone Portal issuer negative suite and byte-for-byte S2S signature parity with CRM F400 gateway; PostgreSQL16 F399 registry, nonce inbox, key rotation and Sites F398 signed lead capture/revocation'
            echo '- Public FAKE CI keys only; no mTLS/HTTP endpoint, IAM ALLOW, real PSP/consent, customer lead, Site provision, token, VPS, merge or deployment'
            echo '- DRAFT / NO GO / NO-MERGE / NO-DEPLOY'
          } >> "$GITHUB_STEP_SUMMARY"
