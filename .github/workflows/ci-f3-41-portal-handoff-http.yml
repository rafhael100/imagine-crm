name: CRM F3-41 - Private Portal handoff HTTP + real CRM PHP classes and PG16

on:
  push:
    branches:
      - dev/f3-41-portal-handoff-http-loopback-2026-11-10
  pull_request:
    paths:
      - 'tests/Labs/F3_40/**'
      - 'tests/Labs/F3_41/**'
      - '.github/workflows/ci-f3-41-portal-handoff-http.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-crm-http-pg16:
    name: PHP ${{ matrix.php }} with isolated HTTP and PG16
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imagine_crm_handoff_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f341-fixture-only-not-a-real-secret
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d imagine_crm_handoff_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CRM_F340_LAB: '1'
      CRM_F341_HTTP_LAB: '1'
      DB_HOST: 127.0.0.1
      DB_DATABASE: imagine_crm_handoff_ci
      DB_PASSWORD: f341-fixture-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql,pgsql
          tools: none
          coverage: none
      - name: Prove test-only HTTP stays outside operational CRM
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'F3_41|router_crm_loopback.php|CRM_F341_HTTP_LAB' \
            routes app bootstrap database/migrations 2>/dev/null; then
            echo 'F3-41 private HTTP test imported into CRM production code' >&2
            exit 1
          fi
      - name: Run CRM class-backed PG16 lab, then signed loopback HTTP calls
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/Labs/F3_40/SyntheticPortalHandoffReceiver.php
          php -l tests/Labs/F3_41/router_crm_loopback.php
          php -l tests/Labs/F3_41/test_http_handoff_pg16.php
          php tests/Labs/F3_40/test_handoff_pg16.php
          export CRM_F341_REQUEST_KEY_HEX="$(openssl rand -hex 48)"
          export CRM_F341_RECEIPT_KEY_HEX="$(openssl rand -hex 48)"
          test "$CRM_F341_REQUEST_KEY_HEX" != "$CRM_F341_RECEIPT_KEY_HEX"
          php -S 127.0.0.1:19141 \
            tests/Labs/F3_41/router_crm_loopback.php >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if php -r '$s=@fsockopen("127.0.0.1",19141,$e,$m,0.2);if($s){fclose($s);exit(0);}exit(1);'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
          php tests/Labs/F3_41/test_http_handoff_pg16.php
