name: CRM WEB-P0 - previa comercial isolada

on:
  pull_request:
    branches:
      - dev/fast-track-crm-2026-11-04
    paths:
      - 'prototypes/site-comercial-crm/**'
      - '.github/workflows/ci-crm-commercial-preview.yml'
  push:
    branches:
      - review/crm-web-p0-commercial-preview-2026-11-13
    paths:
      - 'prototypes/site-comercial-crm/**'
      - '.github/workflows/ci-crm-commercial-preview.yml'

permissions:
  contents: read

jobs:
  preview-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validar integridade visual e limites sem rede
        run: python3 prototypes/site-comercial-crm/tests/test_preview.py
      - name: Exercitar interações reais em Chromium 320/375/768/1280
        run: python3 prototypes/site-comercial-crm/tests/browser_smoke.py
      - name: Capturar imagens estáticas para revisão visual (sem rede)
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          mkdir -p review-screenshots
          for width in 1280 375; do
            if [[ "$width" = 1280 ]]; then height=1000; else height=1700; fi
            profile="$(mktemp -d)"
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --disable-background-networking --no-first-run \
              --user-data-dir="$profile" --window-size="$width,$height" \
              --virtual-time-budget=800 \
              --screenshot="$PWD/review-screenshots/crm-comercial-$width.png" \
              "file://$PWD/prototypes/site-comercial-crm/index.html"
            rm -rf "$profile"
            test -s "review-screenshots/crm-comercial-$width.png"
          done
      - name: Montar pacote de visualização offline
        run: |
          mkdir -p build/crm-preview/assets
          cp prototypes/site-comercial-crm/index.html build/crm-preview/index.html
          cp prototypes/site-comercial-crm/assets/logo-imagine.png build/crm-preview/assets/logo-imagine.png
      - name: Anexar prévia sem dados reais
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-web-p0-preview-offline
          path: build/crm-preview/
          if-no-files-found: error
          retention-days: 7
      - name: Anexar capturas para inspeção humana
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-web-p0-review-desktop-mobile
          path: review-screenshots/
          if-no-files-found: error
          retention-days: 7
