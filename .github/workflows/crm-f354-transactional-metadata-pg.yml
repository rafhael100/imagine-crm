name: CRM F3-54 - Atomic synthetic metadata transaction PG16
on:
  pull_request:
    paths:
      - 'tests/Labs/F3_53/**'
      - 'tests/Labs/F3_54/**'
      - '.github/workflows/crm-f354-transactional-metadata-pg.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rollback-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f353-superuser-synthetic-only
          POSTGRES_DB: f353_nonce_ci
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d f353_nonce_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CRM_F354_PG_LAB: '1'
      DB_HOST: 127.0.0.1
      DB_DATABASE: f353_nonce_ci
      PGPASSWORD: f353-superuser-synthetic-only
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql,pgsql
          tools: none
          coverage: none
      - name: Create isolated nonce and receipt tables
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d f353_nonce_ci -f tests/Labs/F3_53/nonce_pg16.sql
          psql -h 127.0.0.1 -U postgres -d f353_nonce_ci -f tests/Labs/F3_54/transaction_pg16.sql
      - name: Test rollback and idempotent synthetic metadata delivery
        run: |
          php -l tests/Labs/F3_54/test_transactional_metadata_pg.php
          php tests/Labs/F3_54/test_transactional_metadata_pg.php
