name: CRM Private Staging - ephemeral container smoke NO DEPLOY

on:
  pull_request:
    branches:
      - dev/fast-track-crm-2026-11-04
    paths:
      - 'infra/staging/**'
      - '.dockerignore'
      - '.github/workflows/ci-crm-private-staging-smoke.yml'
      - 'app/Core/Leads/**'
      - 'app/Core/Tasks/**'
      - 'app/Core/Billing/**'
      - 'app/Core/Commercial/**'
      - 'resources/views/crm-staging-marketing.blade.php'
      - 'routes/web.php'
      - 'tests/Unit/StagingMarketingPreviewTest.php'
      - 'scripts/ci/check-private-staging-compose.py'
      - 'scripts/ci/rehearse-crm-private-restore.sh'
      - 'scripts/ci/rehearse-crm-private-schema.sh'
      - 'scripts/ci/check-staging-runtime-schema.php'
      - 'database/migrations/**'
      - 'tests/Labs/recovery/**'

permissions:
  contents: read

jobs:
  ephemeral-container-smoke:
    name: Build and smoke localhost-only isolated candidate (CI ephemeral)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prove private Compose input and no public business wiring
        run: python3 scripts/ci/check-private-staging-compose.py
      - name: Generate disposable dummy runtime credentials in this runner
        run: |
          DB_CI_PASSWORD="$(openssl rand -hex 24)"
          APP_DB_CI_PASSWORD="$(openssl rand -hex 24)"
          APP_CI_KEY="base64:$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$DB_CI_PASSWORD"
          echo "::add-mask::$APP_DB_CI_PASSWORD"
          echo "::add-mask::$APP_CI_KEY"
          echo "CRM_STAGING_DB_PASSWORD=$DB_CI_PASSWORD" >> "$GITHUB_ENV"
          echo "CRM_STAGING_APP_DB_PASSWORD=$APP_DB_CI_PASSWORD" >> "$GITHUB_ENV"
          echo "CRM_STAGING_APP_KEY=$APP_CI_KEY" >> "$GITHUB_ENV"
      - name: Build PHP image without deploying or accessing VPS
        run: docker compose -f infra/staging/compose.yaml build app
      - name: Start isolated CI containers on localhost only
        run: docker compose -f infra/staging/compose.yaml up --no-build -d
      - name: Verify private health and public business routes remain unavailable
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 25); do
            if curl --max-time 3 -fsS -o /dev/null http://127.0.0.1:18080/up; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          for path in /api/leads /api/sites/intake /api/tasks; do
            status=$(curl --max-time 4 -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080$path")
            test "$status" = 404
          done
          echo "Private CI health 200; business endpoints 404; localhost port only."
      - name: Verify Laravel marketing page PT EN ES and no checkout or signup
        run: |
          set -euo pipefail
          home="http://127.0.0.1:18080/"
          curl --fail --silent --show-error --max-time 5 "$home" |
            grep -Fq 'Organize seus contatos. Avance suas vendas.'
          curl --fail --silent --show-error --max-time 5 "${home}?lang=en" |
            grep -Fq 'Organize contacts. Move deals forward.'
          curl --fail --silent --show-error --max-time 5 "${home}?lang=es" |
            grep -Fq 'Organiza contactos. Impulsa tus ventas.'
          curl --fail --silent --show-error --max-time 5 "${home}?lang=%3Cscript%3E" |
            grep -Fq 'Organize seus contatos. Avance suas vendas.'
          curl --fail --silent --show-error --max-time 5 "$home" |
            grep -Fq 'R$ 69,00'
          headers="$(curl -fsS -D - -o /dev/null "$home")"
          printf '%s\n' "$headers" | grep -qi '^x-robots-tag: noindex, nofollow, noarchive'
          printf '%s\n' "$headers" | grep -Fq "form-action 'none'"
          for path in /signup /login /checkout /api/trial; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080$path")"
            test "$status" = 404
          done
          echo "Private PT/EN/ES marketing GET only; no signup, checkout, payment or public indexing."
      - name: Restore PostgreSQL backup on separate network-none PG16 server and test RLS
        env:
          CRM_RECOVERY_LAB: synthetic-only
        run: bash scripts/ci/rehearse-crm-private-restore.sh
      - name: Prove real Laravel migration and RLS with separate non-owner app role
        env:
          CRM_SCHEMA_LAB: synthetic-only
        run: bash scripts/ci/rehearse-crm-private-schema.sh
      - name: Collect CI-only container diagnostics on smoke failure
        if: failure()
        run: |
          docker compose -f infra/staging/compose.yaml ps --all || true
          docker compose -f infra/staging/compose.yaml logs --no-color --tail=60 app web postgres || true
      - name: Tear down all synthetic CI containers and their disposable volumes
        if: always()
        run: docker compose -f infra/staging/compose.yaml down --volumes --remove-orphans || true
      - name: Declare NO-GO limitations
        if: always()
        run: |
          {
            echo '### CRM private ephemeral smoke'
            echo '- Runs only inside GitHub hosted runner with generated fake credentials'
            echo '- Localhost health and no public business routes tested'
            echo '- Read-only PT/EN/ES marketing page tested on localhost; no signup/trial/checkout'
            echo '- Asaas billing sources shipped but no sandbox/production billing route or flag enabled'
            echo '- Full pg_dump + pg_restore to second network-none PostgreSQL16 container, FORCE RLS and audit verified'
            echo '- Laravel migration applied and repeated under CI admin; actual PHP app role is NO-SUPERUSER/NO-BYPASSRLS/NO-OWNER with tenant isolation'
            echo '- Containers and disposable volume destroyed before completion'
            echo '- No real customer, Asaas network, Leaseweb connection or production changes'
            echo '- Not sufficient for TLS, backups, operational IAM, RLS or launch GO'
            echo '- DRAFT / NO-MERGE / NO-DEPLOY'
          } >> "$GITHUB_STEP_SUMMARY"
