name: CRM F0 - Fixar dependencias Composer

on:
  push:
    branches:
      - dev/fast-track-crm-2026-11-04

permissions:
  contents: write

concurrency:
  group: crm-f0-lockfile
  cancel-in-progress: false

jobs:
  lock:
    name: Gerar composer.lock reproducivel (somente branch F0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fast-track branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar PHP e Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, curl, zip
          tools: composer:v2
          coverage: none
      - name: Gerar lock se ausente
        run: |
          if test ! -f composer.lock; then
            composer update --no-install --no-interaction --no-progress --prefer-dist
          fi
          composer validate --no-check-publish
      - name: Versionar lock exclusivamente na branch isolada
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/fast-track-crm-2026-11-04'
        run: |
          if git status --porcelain -- composer.lock | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add composer.lock
            git commit -m 'build(crm-f0): travar dependencias Composer da base Laravel'
            git push origin HEAD:refs/heads/dev/fast-track-crm-2026-11-04
          else
            echo 'Composer lock ja versionado; nenhuma alteracao'
          fi
