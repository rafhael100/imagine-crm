name: CRM F3-52 - Four-project synthetic boundary matrix (NO-GO)

on:
  push:
    branches:
      - review/crm-portal-cross-db-ci-isolated-2026-11-11
  pull_request:
    paths:
      - 'tests/Labs/F3_40/**'
      - 'tests/Labs/F3_41/**'
      - 'tests/Labs/F3_42/**'
      - 'tests/Labs/F3_49/**'
      - 'tests/Labs/F3_50/**'
      - 'docs/QA-F352-FOUR-REPO-BOUNDARIES.md'
      - '.github/workflows/ci-crm-portal-cross-db-ci-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-php-pg18-to-crm-php-pg16:
    name: PHP ${{ matrix.php }} - Comercial/Portal/CRM plus Portal/Sites/CRM synthetic checks
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    services:
      crm_pg16:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f342-fixture-only-not-a-real-secret
          POSTGRES_DB: imagine_crm_handoff_ci
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d imagine_crm_handoff_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      portal_pg18:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f342-fixture-only-not-a-real-secret
          POSTGRES_DB: portal_commercial_lab
        ports:
          - '127.0.0.1:5433:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_commercial_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CRM_F340_LAB: '1'
      CRM_F341_HTTP_LAB: '1'
      CRM_F342_CROSS_REPO_LAB: '1'
      CRM_F350_COMERCIAL_CI_LAB: '1'
      PORTAL_F119_PG_LAB: '1'
      DB_HOST: 127.0.0.1
      DB_DATABASE: portal_commercial_lab
      DB_PASSWORD: f342-fixture-only-not-a-real-secret
    steps:
      - name: Checkout CRM Imagine
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout EXACT pinned Portal Imagine revision
        uses: actions/checkout@v5
        with:
          repository: rafhael100/imagine-portal
          ref: af414ed7aece433e65b4f813be12ba3546cc5c8a
          path: portal-source
          persist-credentials: false
      - name: Checkout EXACT pinned CRM CORE-INT-01 review revision (CI-only)
        uses: actions/checkout@v5
        with:
          repository: rafhael100/imagine-crm
          ref: 881ebbf0ddf486f8a85c4848f85719a2f4207f6c
          path: crm-core-source
          persist-credentials: false
      - name: Checkout pinned public Imagine Comercial integration revision (read-only)
        uses: actions/checkout@v5
        with:
          repository: rafhael100/imagine-comercial
          ref: fe42b6c0683ff66d836dc58677f25a8fed2d793d
          path: comercial-source
          persist-credentials: false
      - name: Checkout EXACT pinned Sites PHP source for independent synthetic contracts
        uses: actions/checkout@v5
        with:
          repository: rafhael100/imagine-sites
          ref: 057b6f859df5050c842a86d18676e6332a79d1f9
          path: _synthetic_sites_fixture
          persist-credentials: false
      - name: Checkout separate pinned Portal candidate for Portal-to-Sites PHP contract
        uses: actions/checkout@v5
        with:
          repository: rafhael100/imagine-portal
          ref: bf1b2794de4d6000f120ffa2b1e6dd557f34c35e
          path: portal-sites-candidate
          persist-credentials: false
      - name: Verify both independent source pins and their lab-only entrypoints
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _synthetic_sites_fixture rev-parse HEAD)" = "057b6f859df5050c842a86d18676e6332a79d1f9"
          test "$(git -C portal-sites-candidate rev-parse HEAD)" = "bf1b2794de4d6000f120ffa2b1e6dd557f34c35e"
          test -f _synthetic_sites_fixture/tests/f23-cross-repo.php
          test -f _synthetic_sites_fixture/src/Integration/SyntheticCrmLeadEnvelopeV1Draft.php
          test -f portal-sites-candidate/apps/portal/app/Domain/SitesIntegration/SyntheticSitesEnvelopeSigner.php
          test -f scripts/ci/check-sites-crm-envelope-authority-witness.php
      - name: Verify immutable Portal provenance and no cross-import into runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C portal-source rev-parse HEAD)" = \
            "af414ed7aece433e65b4f813be12ba3546cc5c8a"
          test -f portal-source/apps/portal/labs/commercial-intake-f119/PortalF119SyntheticServiceReservation.php
          test -f portal-source/apps/portal/labs/commercial-intake-f122/unknown_hold_pg18.sql
          if grep -R -E 'F3_42|portal-source|CRM_F342_CROSS_REPO_LAB' \
            app routes bootstrap database/migrations 2>/dev/null; then
            echo "CI-only cross-repo fixture imported into CRM runtime" >&2
            exit 1
          fi
      - name: Assemble approved standalone Core slice only inside the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C crm-core-source rev-parse HEAD)" = "881ebbf0ddf486f8a85c4848f85719a2f4207f6c"
          test ! -f app/Core/Leads/PortalIngressPreparationBoundary.php
          for name in \
            PortalServiceHandoffAssessment \
            PortalServiceHandoffInspector \
            PortalTechnicalEnvelopeDecoder \
            PortalIngressPreparationAssessment \
            PortalIngressPreparationBoundary; do
            test -f "crm-core-source/app/Core/Leads/$name.php"
            cp -- "crm-core-source/app/Core/Leads/$name.php" "app/Core/Leads/$name.php"
            php -l "app/Core/Leads/$name.php"
          done
          # Untracked files stay on this ephemeral runner; no source commit.
          test "$(git ls-files -- app/Core/Leads/PortalIngressPreparationBoundary.php)" = ""
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql,pgsql
          tools: none
          coverage: none
      - name: Use Node 22 for the REAL Comercial P0 preflight
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build metadata-only Comercial to Portal-CRM laboratory bridge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C comercial-source rev-parse HEAD)" = "fe42b6c0683ff66d836dc58677f25a8fed2d793d"
          test -f comercial-source/src/lib/private-budget-preflight.mjs
          node tests/Labs/F3_50/prove_comercial_preflight.mjs
          test -s "$RUNNER_TEMP/crm-f350-comercial-envelope.json"
      - name: Create both databases with independently versioned schemas
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD="$DB_PASSWORD"
          test "$(psql -h 127.0.0.1 -p 5432 -U postgres -d imagine_crm_handoff_ci -tAc 'SHOW server_version_num')" -ge 160000
          test "$(psql -h 127.0.0.1 -p 5433 -U postgres -d portal_commercial_lab -tAc 'SHOW server_version_num')" -ge 180000
          psql -h 127.0.0.1 -p 5432 -U postgres -d imagine_crm_handoff_ci \
            -v ON_ERROR_STOP=1 -f tests/Labs/F3_40/crm_handoff_pg16.sql
          psql -h 127.0.0.1 -p 5433 -U postgres -d portal_commercial_lab \
            -v ON_ERROR_STOP=1 -f portal-source/apps/portal/labs/commercial-intake-f118/fixture_pg18.sql
          psql -h 127.0.0.1 -p 5433 -U postgres -d portal_commercial_lab \
            -v ON_ERROR_STOP=1 -f portal-source/apps/portal/labs/commercial-intake-f119/nonce_pg18.sql
          psql -h 127.0.0.1 -p 5433 -U postgres -d portal_commercial_lab \
            -v ON_ERROR_STOP=1 -f portal-source/apps/portal/labs/commercial-intake-f122/unknown_hold_pg18.sql
      - name: Cross-repo, cross-process, cross-database real PHP integration
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/Labs/F3_42/test_real_portal_crm_cross_repo.php
          php -l portal-source/apps/portal/labs/commercial-intake-f119/PortalF119SyntheticServiceReservation.php
          php -l tests/Labs/F3_41/router_crm_loopback.php
          export CRM_F341_REQUEST_KEY_HEX="$(openssl rand -hex 48)"
          export CRM_F341_RECEIPT_KEY_HEX="$(openssl rand -hex 48)"
          test "$CRM_F341_REQUEST_KEY_HEX" != "$CRM_F341_RECEIPT_KEY_HEX"
          DB_DATABASE=imagine_crm_handoff_ci php -S 127.0.0.1:19141 \
            tests/Labs/F3_41/router_crm_loopback.php >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if php -r '$s=@fsockopen("127.0.0.1",19141,$e,$m,0.2);if($s){fclose($s);exit(0);}exit(1);'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
          php tests/Labs/F3_42/test_real_portal_crm_cross_repo.php
          php -l tests/Labs/F3_49/test_real_core_portal_crm_e2e.php
          php tests/Labs/F3_49/test_real_core_portal_crm_e2e.php
      - name: Prove independent REAL Portal-to-Sites PHP candidate compatibility (F1-23)
        shell: bash
        env:
          SITES_F1_23_CROSS_REPO: '1'
          SITES_F1_23_PORTAL_PATH: ${{ github.workspace }}/portal-sites-candidate
        run: |
          set -euo pipefail
          php -l _synthetic_sites_fixture/tests/f23-cross-repo.php
          php -l portal-sites-candidate/apps/portal/app/Domain/SitesIntegration/SyntheticSitesEnvelopeSigner.php
          php _synthetic_sites_fixture/tests/f23-cross-repo.php
      - name: Prove independent REAL Sites-to-CRM PHP shape and authority-denial (F3-51)
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/ci/check-sites-crm-envelope-authority-witness.php
          php -l app/Core/Leads/SyntheticLeadEnvelopeV1Inspector.php
          php -l _synthetic_sites_fixture/src/Integration/SyntheticCrmLeadEnvelopeV1Draft.php
          php scripts/ci/check-sites-crm-envelope-authority-witness.php
      - name: Retain fail-closed release status
        if: always()
        run: |
          echo "NO-GO: synthetic independent seams are not one operational four-system transaction."
          echo "NO VPS, staging credentials, real leads, client login, publication, billing or deploy."
