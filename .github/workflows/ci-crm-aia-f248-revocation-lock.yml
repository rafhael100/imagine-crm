name: CRM F248 - row-lock Ed25519 key revocation vs PostgreSQL nonce

on:
  pull_request:
    branches:
      - dev/aia-f247-rls-pg-integrated-deny-2026-11-15

permissions:
  contents: read

concurrency:
  group: crm-aia-f248-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  key-revocation-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: imagine_crm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imagine_crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1
      AIA_F248_ROW_LOCK_LAB: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: imagine_crm_ci
      DB_USERNAME: postgres
      DB_PASSWORD: ci-only-password
      RLS_TEST_USERNAME: crm_app_ci
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout exact CRM review HEAD without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout original Ed25519 verifier at immutable Agents revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-ai-agents
          ref: fbf50543e7c52e6c59c6ffec58b7f6a6d30564b5
          path: _aia_f248_lock_fixture
          persist-credentials: false
      - name: Assert runner, source SHA and disposable database identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rafhael100/imagine-crm"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C _aia_f248_lock_fixture rev-parse HEAD)" = "fbf50543e7c52e6c59c6ffec58b7f6a6d30564b5"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_DATABASE" = "imagine_crm_ci"
      - name: PHP 8.4 with PostgreSQL and Sodium, no deploy
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, ctype, openssl, sodium, pdo_pgsql, pgsql
          coverage: none
          tools: composer
      - name: Load locked Laravel dependencies and temporary app key
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Validate lock code and no accidental route registration
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Support/Synthetic/AgentsPrivateKeyRevocationLockLab.php
          php -l tests/Feature/AgentsPrivateKeyRevocationLockTest.php
          php -l _aia_f248_lock_fixture/src/MockBridge/MockServiceIdentityPreflight.php
          if grep -R -E 'AgentsPrivateKeyRevocationLockLab|__synthetic_f248_lock' routes bootstrap; then
            echo 'F248_UNAUTHORIZED_ROUTE'; exit 1
          fi
          test ! -e routes/api.php
      - name: Execute physical PostgreSQL revocation race and deny-first tests
        shell: bash
        run: |
          set -euo pipefail
          php artisan test --filter=AgentsPrivateKeyRevocationLockTest --no-ansi
          echo 'F248_KEY_ROW_LOCK_LAB_ONLY operational_decision=NO_GO' >> "$GITHUB_STEP_SUMMARY"
