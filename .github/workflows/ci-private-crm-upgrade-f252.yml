name: CRM Private F252 - guarded private upgrade policy (NO DEPLOY)
on:
  pull_request:
    branches: [dev/fast-track-crm-2026-11-04]
    paths:
      - 'scripts/ops/private-crm-upgrade-f252.py'
      - 'scripts/ops/test-private-crm-upgrade-f252.py'
      - 'scripts/ops/private-crm-release-preflight.py'
      - '.github/workflows/ci-private-crm-upgrade-f252.yml'
      - 'docs/operations/private-complete-journey.md'
permissions:
  contents: read
concurrency:
  group: crm-private-f252-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  private-upgrade-static-policy:
    name: private-upgrade-static-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check immutable identity, tests and manual-review-only baseline
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rafhael100/imagine-crm"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor ea5d320addaeb7ab970bdfa3931d55ddea37afac "$CANDIDATE_SHA"
          python3 -m py_compile scripts/ops/private-crm-upgrade-f252.py
          python3 -m py_compile scripts/ops/test-private-crm-upgrade-f252.py
          python3 scripts/ops/test-private-crm-upgrade-f252.py
          python3 scripts/ops/private-crm-release-preflight.py \
            ea5d320addaeb7ab970bdfa3931d55ddea37afac \
            "$CANDIDATE_SHA" | tee "$RUNNER_TEMP/private-f252-preflight.json"
          python3 - "$RUNNER_TEMP/private-f252-preflight.json" <<'PY'
          import json,sys
          status=json.load(open(sys.argv[1]))
          assert status["status"] == "MANUAL_REVIEW_REQUIRED"
          assert status["deploy_approved"] is False
          assert status["no_deploy_executed"] is True
          assert not status["blocked"]
          print("F252 PASS: no VPS access, no deployment; human review required.")
          PY
