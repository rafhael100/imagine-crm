name: CRM private autostart - deny-only synthetic regression

on:
  pull_request:
    branches:
      - fix/crm-private-autostart-2026-11-18
    paths:
      - scripts/ops/test-private-crm-autostart-deny.py
      - .github/workflows/ci-crm-autostart-deny.yml

permissions:
  contents: read

jobs:
  deny-only:
    if: >-
      github.event.pull_request.draft &&
      github.event.pull_request.head.ref == 'test/crm-private-autostart-deny-only-2026-11-18' &&
      github.event.pull_request.head.repo.full_name == 'rafhael100/imagine-crm'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact PR head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prove fail-closed autostart guards with in-memory inventories
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B -m py_compile scripts/ops/test-private-crm-autostart-deny.py
          python3 -B scripts/ops/test-private-crm-autostart-deny.py
