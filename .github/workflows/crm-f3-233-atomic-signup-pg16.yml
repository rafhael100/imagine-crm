name: CRM Imagine - F3-233 Atomic Signup PG16 CI Lab

on:
  pull_request:
    branches:
      - dev/fast-track-crm-2026-11-04
    paths:
      - 'scripts/ci/check-atomic-signup-otp-trial-pg16.php'
      - '.github/workflows/crm-f3-233-atomic-signup-pg16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-signup:
    name: PostgreSQL16 one-time OTP + one-trial transaction (NO-GO)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: imagine_signup_atomic_ci
          POSTGRES_USER: signup_atomic_ci
          POSTGRES_PASSWORD: only-disposable-fixture-signup-atomic-2026
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U signup_atomic_ci -d imagine_signup_atomic_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      TRIAL_OTP_LAB_HOST: 127.0.0.1
      TRIAL_OTP_LAB_PORT: '5436'
      TRIAL_OTP_LAB_DB: imagine_signup_atomic_ci
      TRIAL_OTP_LAB_USER: signup_atomic_ci
      TRIAL_OTP_LAB_PASS: only-disposable-fixture-signup-atomic-2026
    steps:
      - name: Checkout review-only PR revision
        uses: actions/checkout@v4

      - name: PHP 8.4 with PG16 PDO
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql
          coverage: none

      - name: Syntax check three existing Core modules and isolated script
        run: |
          php -l app/Core/Identity/OfflineSignupOtpChallenge.php
          php -l app/Core/Identity/OfflineCnpjChecksumInspector.php
          php -l app/Core/Identity/OfflineCnpjTrialHmacBinding.php
          php -l scripts/ci/check-atomic-signup-otp-trial-pg16.php

      - name: Real PG16 two-session atomic transaction and rollback proof
        run: php scripts/ci/check-atomic-signup-otp-trial-pg16.php
