name: Private CRM complete journey - isolated synthetic staging
on:
  pull_request:
    branches: [dev/fast-track-crm-2026-11-04]
    paths:
      - 'app/Homologation/**'
      - 'app/Core/Identity/**'
      - 'app/Providers/AppServiceProvider.php'
      - 'config/**'
      - 'routes/private-homologation.php'
      - 'resources/views/crm-private-journey.blade.php'
      - 'infra/homologation/**'
      - 'scripts/ops/*private-crm*'
      - 'scripts/ops/private-backup-crypt.php'
      - '.github/workflows/ci-private-crm-journey.yml'
permissions:
  contents: read
concurrency:
  group: private-crm-journey-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-private-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CRM_PRIVATE_PROJECT: imagine-crm-journey-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Create fresh, masked, runner-only credentials
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == rafhael100/imagine-crm ]]
          [[ "$GITHUB_EVENT_NAME" == pull_request ]]
          python3 scripts/ops/create-private-crm-environment.py "$RUNNER_TEMP/crm-private.env" "$RUNNER_TEMP/crm-private-data" "$CANDIDATE_SHA"
          echo "CRM_PRIVATE_ENV_FILE=$RUNNER_TEMP/crm-private.env" >> "$GITHUB_ENV"
      - name: Render Compose quietly; build exact private application
        run: |
          set -euo pipefail
          docker compose --env-file "$CRM_PRIVATE_ENV_FILE" -p "$CRM_PRIVATE_PROJECT" -f infra/homologation/compose.yaml config --quiet
          docker compose --env-file "$CRM_PRIVATE_ENV_FILE" -p "$CRM_PRIVATE_PROJECT" -f infra/homologation/compose.yaml build app
      - name: Start only isolated loopback staging stack
        run: |
          set -euo pipefail
          docker compose --env-file "$CRM_PRIVATE_ENV_FILE" -p "$CRM_PRIVATE_PROJECT" -f infra/homologation/compose.yaml up -d --no-build
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 3 -o /dev/null http://127.0.0.1:18086/up; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
      - name: Compile all Blade views and lint private PHP implementation
        run: |
          set -euo pipefail
          docker compose --env-file "$CRM_PRIVATE_ENV_FILE" -p "$CRM_PRIVATE_PROJECT" -f infra/homologation/compose.yaml exec -T app sh -c 'find app/Homologation -name "*.php" -exec php -l {} \; && php artisan view:cache'
      - name: Prove encrypted empty-schema backup and separate restore before persistent fixtures
        run: sudo env CRM_PRIVATE_ENV_FILE="$CRM_PRIVATE_ENV_FILE" CRM_PRIVATE_PROJECT="$CRM_PRIVATE_PROJECT" python3 scripts/ops/backup-private-crm.py "$RUNNER_TEMP/crm-private-data/backups"
      - name: Seed temporary fictional identities without printing credentials
        run: docker compose --env-file "$CRM_PRIVATE_ENV_FILE" -p "$CRM_PRIVATE_PROJECT" -f infra/homologation/compose.yaml run --rm -T tools scripts/ops/seed-private-crm-fixtures.php seed
      - name: Real HTTP commercial signup OTP MFA trial CRM and administrator
        run: sudo env CRM_PRIVATE_ENV_FILE="$CRM_PRIVATE_ENV_FILE" CRM_PRIVATE_PROJECT="$CRM_PRIVATE_PROJECT" python3 scripts/ops/test-private-crm-http.py "$RUNNER_TEMP/crm-private-data/fixtures.json"
      - name: Prove backup and restore with actual fictional records and tenant scopes
        run: sudo env CRM_PRIVATE_ENV_FILE="$CRM_PRIVATE_ENV_FILE" CRM_PRIVATE_PROJECT="$CRM_PRIVATE_PROJECT" python3 scripts/ops/backup-private-crm.py "$RUNNER_TEMP/crm-private-data/backups"
      - name: Sanitized diagnostics on failure
        if: failure()
        run: |
          if test -f "$CRM_PRIVATE_ENV_FILE"; then
            docker compose --env-file "$CRM_PRIVATE_ENV_FILE" -p "$CRM_PRIVATE_PROJECT" -f infra/homologation/compose.yaml logs --tail 50 app web postgres
          fi
      - name: Remove only this runner's synthetic project and volumes
        if: always()
        run: |
          if test -f "$CRM_PRIVATE_ENV_FILE"; then
            docker compose --env-file "$CRM_PRIVATE_ENV_FILE" -p "$CRM_PRIVATE_PROJECT" -f infra/homologation/compose.yaml down --volumes --remove-orphans
          fi
