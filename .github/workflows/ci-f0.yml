name: CRM Imagine - F0 CI

on:
  push:
    branches:
      - dev/fast-track-crm-2026-11-04
  pull_request:
    branches:
      - main
      - dev/fast-track-crm-2026-11-04

permissions:
  contents: read

concurrency:
  group: crm-f0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP 8.4 / Laravel 13 / PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, curl, zip, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Validate Composer definition
        run: composer validate --no-check-publish

      - name: Install PHP dependencies (no database migrations)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare ephemeral test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan --version

      - name: Run tests with synthetic data only
        run: php artisan test --no-ansi

      - name: Browser smoke test of offline synthetic CRM prototype
        run: php scripts/ci/check-offline-prototype-browser.php

      - name: Browser smoke test at 320px CSS viewport
        run: php scripts/ci/check-offline-prototype-320.php

      - name: Browser smoke test of standalone follow-up dashboard (desktop and 320px)
        run: php scripts/ci/check-followup-dashboard-browser.php

      - name: Browser smoke test of offline follow-up worklist (desktop and 320px)
        run: php scripts/ci/check-followup-worklist-browser.php

      - name: Browser smoke test of synthetic CSV preview (desktop and 320px)
        run: php scripts/ci/check-offline-csv-risk-preview-browser.php

      - name: Browser smoke test of offline Kanban opportunities (desktop and real 320px)
        run: php scripts/ci/check-offline-kanban-browser.php

      - name: Browser smoke test of offline CRM prototype hub (1100px and 320px)
        run: php scripts/ci/check-offline-prototype-hub-browser.php

      - name: Browser smoke test of CSV checklist (1100px and 320px)
        run: php scripts/ci/check-offline-csv-checklist-browser.php

      - name: Browser smoke test of synthetic technical submission review (1100px and 320px)
        run: php scripts/ci/check-offline-submission-review-browser.php
