name: CRM Sites F398 original cross-repo capture compatibility (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'scripts/ci/verify-original-sites-f398-envelope.php'
      - '.github/workflows/ci-crm-sites-f398-original-envelope.yml'
      - 'docs/desenvolvimento/CRM-SITES-F398-interop-envelope-original.md'
permissions:
  contents: read
jobs:
  original-sites-to-crm-canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      APP_ENV: testing
      CRM_SITES_F398_CI: '1'
      SITES_F398_CRM_CAPTURE_CI: '1'
      F398_SITES_SOURCE: ./sites-f398
      CRM_LEADS_SIGNING_KEY_CI: CI-ONLY-FAKE-KEY-2026-11-14-SITES-LEADS-PG05-NOT-SECRET
    steps:
      - name: Checkout reviewed CRM PR HEAD with no persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout original Sites F398 at exact immutable SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rafhael100/imagine-sites
          ref: 1e24f47f7dd96c0e5d4b68f5a71aed7c861179f4
          path: sites-f398
          persist-credentials: false
      - name: PHP with no project or secrets installation
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Match original exact Sites source and original CRM canonicalization
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = rafhael100/imagine-crm
          test "$(git -C sites-f398 rev-parse HEAD)" = 1e24f47f7dd96c0e5d4b68f5a71aed7c861179f4
          php -l sites-f398/src/Integration/SyntheticCrmCaptureEnvelope.php
          php -l app/Core/Leads/LaboratorySignedSiteCapture.php
          php -l scripts/ci/verify-original-sites-f398-envelope.php
          php scripts/ci/verify-original-sites-f398-envelope.php
      - name: Record limited scope
        run: echo 'CI proves original Sites-to-CRM signed canonical byte compatibility only. CRM PG16 persistent capture suite is independent; NO identity, provisioning, endpoint, charge, merge or deploy.' >> "$GITHUB_STEP_SUMMARY"
