name: CRM Imagine - F3-267 Ephemeral Private Staging Runtime Smoke (DRAFT ONLY)

on:
  pull_request:
    branches:
      - dev/fast-track-crm-2026-11-04
    paths:
      - 'composer.json'
      - 'composer.lock'
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/migrations/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'infra/staging/**'
      - 'scripts/ci/verify-staging-rendered-compose.php'
      - 'scripts/ci/verify-private-staging-runtime.sh'
      - '.github/workflows/ci-crm-private-staging-runtime-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-f3-267-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-smoke:
    name: Disposable runner - build and smoke only; no VPS/production
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_FILE: infra/staging/compose.yaml
      COMPOSE_PROJECT_NAME: imagine-crm-stage-review
      COMPOSE_DISABLE_ENV_FILE: '1'
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Checkout reviewed PR revision (no credentials retained)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce normalized private Compose contract before touching Docker
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose config --format json | php scripts/ci/verify-staging-rendered-compose.php
      - name: Build both temporary images from the reviewed source
        shell: bash
        run: |
          set -euo pipefail
          docker compose build --progress plain app web
      - name: Start only two review services on the ephemeral local runner
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --no-build --no-recreate
      - name: Run PHP platform, nginx config and private HTTP deny-only smoke
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/verify-private-staging-runtime.sh
      - name: Confirm no customer data or deployment was used
        if: always()
        shell: bash
        run: |
          {
            echo '### F3-267: isolated PR runtime evidence only'
            echo '- A GitHub-hosted disposable runner builds temporary Nginx and PHP-FPM images'
            echo '- Uses only checkout source and fake/memory-only Laravel configuration'
            echo '- HTTP is bound to 127.0.0.1:18080 inside the ephemeral runner'
            echo '- Probes /up and denial of unpublished business endpoints'
            echo '- No VPS, domain, Docker registry push, deploy, cloud secrets or customer DB'
            echo '- This job does NOT imply release readiness, SEG/DBA approval or merge authorization'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Always delete containers, images and temporary volumes
        if: always()
        shell: bash
        run: |
          set +e
          docker compose down --remove-orphans --volumes --rmi local
          docker image prune --force --filter 'until=1h' >/dev/null 2>&1
          exit 0
