name: CRM CORE-INT-02 - Multiworker signed HTTP idempotency over PG16

on:
  push:
    branches:
      - review/crm-portal-cross-db-ci-isolated-2026-11-11
  pull_request:
    paths:
      - 'tests/Labs/F3_40/**'
      - 'tests/Labs/F3_41/**'
      - 'tests/Labs/F3_43/**'
      - '.github/workflows/ci-crm-portal-multiworker-concurrency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiworker-claim-concurrency:
    name: PHP ${{ matrix.php }} / four real workers / disposable PG16
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f343-fixture-only-not-a-real-secret
          POSTGRES_DB: imagine_crm_handoff_ci
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d imagine_crm_handoff_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CRM_F340_LAB: '1'
      CRM_F341_HTTP_LAB: '1'
      CRM_F343_CONCURRENT_LAB: '1'
      DB_HOST: 127.0.0.1
      DB_DATABASE: imagine_crm_handoff_ci
      DB_PASSWORD: f343-fixture-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql,pgsql
          coverage: none
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Block concurrency test code from operational CRM runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'F3_43|CRM_F343_CONCURRENT_LAB|concurrent_http_pg16' \
            routes bootstrap app database/migrations 2>/dev/null; then
            echo "Synthetic F3-43 HTTP tests imported into runtime" >&2
            exit 1
          fi
      - name: Initialize metadata-only PG16 receiver and exercise old F3-40 regressions
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/Labs/F3_40/SyntheticPortalHandoffReceiver.php
          php -l tests/Labs/F3_41/router_crm_loopback.php
          node --check tests/Labs/F3_43/concurrent_http_pg16.mjs
          test "$(node --version | cut -d. -f1)" = v22
          php tests/Labs/F3_40/test_handoff_pg16.php
      - name: Race multiple real PHP processes with signed requests and readback
        shell: bash
        run: |
          set -euo pipefail
          export CRM_F341_REQUEST_KEY_HEX="$(openssl rand -hex 48)"
          export CRM_F341_RECEIPT_KEY_HEX="$(openssl rand -hex 48)"
          test "$CRM_F341_REQUEST_KEY_HEX" != "$CRM_F341_RECEIPT_KEY_HEX"
          export PHP_CLI_SERVER_WORKERS=4
          php -S 127.0.0.1:19141 \
            tests/Labs/F3_41/router_crm_loopback.php >/dev/null 2>&1 &
          server_pid=$!
          cleanup() {
            pkill -TERM -P "$server_pid" >/dev/null 2>&1 || true
            kill "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if php -r '$s=@fsockopen("127.0.0.1",19141,$e,$m,0.2);if($s){fclose($s);exit(0);}exit(1);'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
          child_count="$(ps -o pid= --ppid "$server_pid" | wc -l)"
          test "$child_count" -ge 4
          node tests/Labs/F3_43/concurrent_http_pg16.mjs
